<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 260px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1e1e22;
      color: #f1f1f4;
    }
    .wrap { padding: 16px; }
    h1 { font-size: 14px; margin: 0 0 12px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
    h1 img { width: 18px; height: 18px; border-radius: 4px; }
    button {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: #4f8cff;
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: #3a7afe; }
    button:disabled { background: #3a3a40; color: #888; cursor: default; }
    .status {
      margin-top: 12px;
      font-size: 12px;
      color: #b8b8c0;
      min-height: 16px;
      line-height: 1.4;
    }
    .bar {
      margin-top: 10px;
      height: 6px;
      border-radius: 3px;
      background: #34343a;
      overflow: hidden;
      display: none;
    }
    .bar > div {
      height: 100%;
      width: 0%;
      background: #4f8cff;
      transition: width 0.15s ease;
    }
    .footer {
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: #8a8a92;
    }
    .footer kbd {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: #2c2c31; border: 1px solid #3a3a40; border-radius: 4px;
      padding: 1px 5px; color: #c8c8d0;
    }
    .footer a { color: #6ba0ff; text-decoration: none; cursor: pointer; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1><img src="icons/icon48.png" alt="" /> <span data-i18n="appName">Full Page Screenshot</span></h1>
    <button id="capture" data-i18n="popupCapture">Capture full page</button>
    <button id="grant" style="display:none;background:#2c8c5a;margin-top:8px" data-i18n="grantAccess">Grant access</button>
    <div class="bar"><div id="barFill"></div></div>
    <div class="status" id="status"></div>
    <div class="footer">
      <span id="shortcutHint"></span>
      <a id="openOptions" data-i18n="popupOptions">Options</a>
    </div>
  </div>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
