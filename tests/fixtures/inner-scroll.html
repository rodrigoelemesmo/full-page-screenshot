<!DOCTYPE html><html><head><meta charset="utf-8"><title>inner-scroll</title>
<link rel="stylesheet" href="_style.css">
<style>html,body{height:100%;overflow:hidden}
#scroller{height:100vh;overflow:auto}</style>
</head>
<body data-inner="1">
  <div id="scroller">
    <div class="top">TOP marker (cyan)</div>
    <div class="fill" style="height:2880px">Content scrolls inside this div, not the window (Google-Docs-like).</div>
    <div class="bottom" id="bottom">BOTTOM marker (magenta)</div>
  </div>
</body></html>
